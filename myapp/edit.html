{% extends 'myapp/base.html' %}
{% block title %} Edit Employee Record {% endblock %}

{% block container %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-6 col-xl-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white p-3">
                    <h4 class="card-title mb-0"> Edit Employee Profile</h4>
                </div>
                <div class="card-body p-4 bg-white">

                    <!-- Form actions point reliably to your update mapping configuration -->
                    <form method="post" action="/myapp/update/">
                        {% csrf_token %} <!-- Essential token block preventing security intercepts -->

                        <!-- Hidden entry layout keeping track of primary row targets -->
                        <input type="hidden" name="eid" value="{{ data.id }}">

                        <div class="mb-3">
                            <label class="form-label font-weight-bold">Employee ID (Read-only)</label>
                            <input type="text" class="form-control bg-light" value="{{ data.eid }}" readonly>
                        </div>

                        <div class="mb-3">
                            <label for="ename" class="form-label">Employee Name</label>
                            <input type="text" id="ename" name="ename" class="form-control" value="{{ data.ename }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="eloc" class="form-label">Station Base Location</label>
                            <input type="text" id="eloc" name="eloc" class="form-control" value="{{ data.eloc }}" required>
                        </div>

                        <div class="mb-4">
                            <label for="esal" class="form-label">Base Salary Package</label>
                            <input type="text" id="esal" name="esal" class="form-control" value="{{ data.esal }}" required>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Commit Update Changes</button>
                            <a href="/myapp/crud/" class="btn btn-outline-secondary">Abort & Cancel</a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
