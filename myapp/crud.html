{% extends 'myapp/base.html' %}
{% block container %}
<div class="container">
    <div class="row">
        <div class="col-md-6 col-lg-6 col-xl-6">
            <h1>{{msg}}</h1>

            <form method="get" action="/myapp/crud_data/">
                Eid:<input type="text" name="eid" class="form-control"><br>
                <input type="submit" name="sub" value="Display" class="btn btn-primary">
                <input type="submit" name="sub" value="Delete" class="btn btn-danger">
                <input type="submit" name="sub" value="Edit" class="btn btn-secondary">
            </form>
        </div>
    </div>
    <hr>
    <table class="table">
        <tr>
            <th>Eid</th>
            <th>Ename</th>
            <th>Eloc</th>
            <th>Esal</th>
        </tr>
        <tr>
            <td>{{data.eid}}</td>
            <td>{{data.ename}}</td>
            <td>{{data.eloc}}</td>
            <td>{{data.esal}}</td>
        </tr>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
{% endblock %}

{% endblock %}
