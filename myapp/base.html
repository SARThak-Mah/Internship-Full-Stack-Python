<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} DevPortal {% endblock %}</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold text-primary" href="/myapp/home/">DevPortal</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <!-- Main Links -->
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" href="/myapp/home/">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/myapp/empform/">Insert & Display</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/myapp/crud/">CRUD Admin Panel</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/myapp/product/">Products</a>
        </li>
      </ul>

      <!-- User Auth Section -->
      <div class="d-flex align-items-center gap-2">
        {% if user.is_authenticated %}
            <span class="text-light me-2">👤 {{ user.username }}</span>
            <a href="/myapp/userlogout/" class="btn btn-outline-danger btn-sm">Logout</a>
        {% else %}
            <a href="/myapp/loginform/" class="btn btn-outline-light btn-sm">Login</a>
            <a href="/myapp/signupform/" class="btn btn-primary btn-sm">Sign Up</a>
        {% endif %}
      </div>

    </div>
  </div>
</nav>

<!-- Dynamic Content Injection Container -->
<div class="container my-4">
    {% block container %}
    <!-- Child template content loads here -->
    {% endblock %}
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

{% block footer %}
<!-- Optional page-specific footer -->
{% endblock %}

</body>
</html>
